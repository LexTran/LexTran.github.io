<!DOCTYPE html>
<html lang="{% if page.lang == 'zh' %}zh-CN{% else %}en{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="author" content="Lixing Tan / 谭立行">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title | escape }}</title>
  <link rel="canonical" href="{{ page.permalink | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ '/meitu.html' | absolute_url }}">
  <link rel="alternate" hreflang="zh-CN" href="{{ '/meitu_cn.html' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <script>try { var theme = localStorage.getItem('theme'); if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="{{ '/css/profile.css' | relative_url }}?v=20261031meitu">
  <link rel="stylesheet" href="{{ '/css/work.css' | relative_url }}?v=20261031b">
  <script src="{{ '/js/profile.js' | relative_url }}?v=20261025f" defer></script>
  <script src="{{ '/js/work.js' | relative_url }}?v=20261031b" defer></script>
</head>
<body class="work-page">
  {% assign chinese = false %}
  {% if page.lang == 'zh' %}{% assign chinese = true %}{% endif %}
  <a class="skip-link" href="#work-content">{% if chinese %}跳至正文{% else %}Skip to content{% endif %}</a>
  <div class="work-topbar">
    <a class="work-home" href="{% if chinese %}{{ '/homepage_cn.html' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}#experience">← Lixing Tan <span>/ {% if chinese %}实习工作{% else %}Internship work{% endif %}</span></a>
    <div class="work-tools">
      <a href="{% if chinese %}{{ '/meitu.html' | relative_url }}{% else %}{{ '/meitu_cn.html' | relative_url }}{% endif %}" lang="{% if chinese %}en{% else %}zh-CN{% endif %}">{% if chinese %}English{% else %}中文{% endif %}</a>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="{% if chinese %}切换深色模式{% else %}Toggle dark mode{% endif %}">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>
  <main class="work-shell" id="work-content" tabindex="-1">{{ content }}</main>
  <dialog class="lightbox" aria-label="{% if chinese %}查看大图{% else %}Image preview{% endif %}">
    <button class="lightbox-close" type="button" aria-label="{% if chinese %}关闭{% else %}Close{% endif %}">×</button>
    <img alt="">
    <p class="lightbox-caption"></p>
  </dialog>
</body>
</html>
